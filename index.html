/* ============ RANDOM + MATH HELPERS ============ */
let _s=1;
const setSeed=s=>{_s=s|0};
const rnd=()=>{_s=(_s+0x6D2B79F5)|0;let t=Math.imul(_s^(_s>>>15),1|_s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[ri(0,a.length-1)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const fr=(n,d)=>{const g=gcd(n,d);return d/g===1?`${n/g}`:`${n/g}/${d/g}`};
const C=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r)};
const mp=(b,e,m)=>{let r=1;b%=m;while(e>0){if(e&1)r=r*b%m;b=b*b%m;e>>=1}return r};

/* ============ PROBLEM BANK ============
 Each generator returns {q, ans, wrong?, hints:[nudge, formula], steps:[...]}.
 Add new generators to GEN[topic][level] — or push custom school sets there. */
const TOPICS=["Algebra","Geometry","Number Theory","Probability","Combinatorics","Ratios & Percent","Coordinate Geometry","Logic & Puzzles"];

const COP=[[3,4],[2,5],[3,5],[4,7],[5,6],[2,9],[7,8]];

const GEN={
Algebra:[
 [()=>{const x=ri(2,12),a=ri(2,9),b=ri(1,20);return{q:`Solve for x: ${a}x + ${b} = ${a*x+b}`,ans:`${x}`,hints:[`Undo the + ${b} first.`,`Subtract ${b} from both sides, then divide by ${a}.`],steps:[`Subtract ${b}: ${a}x = ${a*x}`,`Divide by ${a}: x = ${x}`]}},
  ()=>{const x=ri(8,30),y=ri(1,7);return{q:`Two numbers add to ${x+y} and differ by ${x-y}. What is the larger number?`,ans:`${x}`,hints:["Write two equations: one for the sum, one for the difference.","Adding x + y = S and x − y = D gives 2x = S + D."],steps:[`Add the equations: 2x = ${x+y} + ${x-y} = ${2*x}`,`x = ${x}`]}}],
 [()=>{const S=ri(4,12),P=ri(1,20);return{q:`If x + y = ${S} and xy = ${P}, what is x² + y²?`,ans:`${S*S-2*P}`,hints:["Try squaring x + y.","(x + y)² = x² + 2xy + y²"],steps:[`(x + y)² = ${S}² = ${S*S}`,`x² + y² = ${S*S} − 2(${P}) = ${S*S-2*P}`]}},
  ()=>{const a=ri(1,9),d=ri(2,6),n=ri(8,20),s=n*(2*a+(n-1)*d)/2;return{q:`Find the sum of the first ${n} terms of the arithmetic sequence starting at ${a} with common difference ${d}.`,ans:`${s}`,hints:["Pair the first and last terms.","Sₙ = n(2a + (n − 1)d) / 2"],steps:[`2a + (n−1)d = ${2*a} + ${(n-1)*d} = ${2*a+(n-1)*d}`,`S = ${n} × ${2*a+(n-1)*d} / 2 = ${s}`]}}],
 [()=>{const k=ri(3,9);return{q:`If x + 1/x = ${k}, find x² + 1/x².`,ans:`${k*k-2}`,hints:["Square the given equation.","(x + 1/x)² = x² + 2 + 1/x²"],steps:[`${k}² = x² + 2 + 1/x²`,`x² + 1/x² = ${k*k} − 2 = ${k*k-2}`]}},
  ()=>{const S=ri(3,8),P=ri(1,12);return{q:`If a + b = ${S} and ab = ${P}, find a³ + b³.`,ans:`${S**3-3*S*P}`,hints:["Cube a + b and look for a³ + b³ inside.","a³ + b³ = (a + b)³ − 3ab(a + b)"],steps:[`(a+b)³ = ${S**3}`,`3ab(a+b) = 3·${P}·${S} = ${3*S*P}`,`a³ + b³ = ${S**3} − ${3*S*P} = ${S**3-3*S*P}`]}}]],
Geometry:[
 [()=>{const [a,b,c]=pick(TRI),k=ri(1,3);return{q:`A right triangle has legs ${a*k} and ${b*k}. What is the hypotenuse?`,ans:`${c*k}`,hints:["Which theorem relates the sides of a right triangle?","a² + b² = c²"],steps:[`${(a*k)**2} + ${(b*k)**2} = ${(c*k)**2}`,`c = ${c*k}`]}},
  ()=>{const A=ri(30,80),B=ri(30,80);return{q:`Two angles of a triangle measure ${A}° and ${B}°. What is the third angle (in degrees)?`,ans:`${180-A-B}`,hints:["Angles in a triangle add up to a fixed total.","Sum of angles = 180°"],steps:[`${A} + ${B} = ${A+B}`,`180 − ${A+B} = ${180-A-B}`]}}],
 [()=>{const n=pick([5,6,8,9,10,12]),a=180*(n-2)/n;return{q:`What is each interior angle (in degrees) of a regular ${n}-gon?`,ans:`${a}`,hints:["First find the total of all interior angles.","Sum = 180(n − 2); divide by n."],steps:[`Sum = 180 × ${n-2} = ${180*(n-2)}`,`Each angle = ${180*(n-2)} / ${n} = ${a}°`]}},
  ()=>{const [a,b,c]=pick(TRI),k=ri(1,3);return{q:`A right triangle has hypotenuse ${c*k} and one leg ${a*k}. What is its area?`,ans:`${a*b*k*k/2}`,hints:["Find the missing leg first.","Area = ½ × leg × leg"],steps:[`Other leg = √(${(c*k)**2} − ${(a*k)**2}) = ${b*k}`,`Area = ½ × ${a*k} × ${b*k} = ${a*b*k*k/2}`]}}],
 [()=>{const n=ri(7,14);return{q:`How many diagonals does a convex ${n}-sided polygon have?`,ans:`${n*(n-3)/2}`,hints:["Each vertex connects to some non-adjacent vertices. How many?","n(n − 3) / 2"],steps:[`Each vertex: ${n} − 3 = ${n-3} diagonals`,`Each is counted twice: ${n}×${n-3}/2 = ${n*(n-3)/2}`]}},
  ()=>{const [a,b,c,A]=pick(HER),k=ri(1,3),s=(a+b+c)*k/2;return{q:`A triangle has sides ${a*k}, ${b*k}, ${c*k}. What is its area?`,ans:`${A*k*k}`,hints:["Heron’s formula, or drop an altitude.","Area = √(s(s−a)(s−b)(s−c)), s = half the perimeter"],steps:[`s = ${s}`,`Area = √(${s}·${s-a*k}·${s-b*k}·${s-c*k}) = ${A*k*k}`]}}]],
"Number Theory":[
 [()=>{const [a,b]=pick(COP),g=ri(2,9);return{q:`What is the greatest common divisor of ${a*g} and ${b*g}?`,ans:`${g}`,hints:["Factor each number.","GCD = product of shared prime factors"],steps:[`${a*g} = ${g} × ${a}, ${b*g} = ${g} × ${b}`,`${a} and ${b} share no factor, so GCD = ${g}`]}},
  ()=>{const m=ri(5,13),q=ri(5,20),r=ri(1,m-1),N=q*m+r;return{q:`What is the remainder when ${N} is divided by ${m}?`,ans:`${r}`,hints:["Find the largest multiple of the divisor below the number.",`${N} = ${m}q + r`],steps:[`${m} × ${q} = ${m*q}`,`${N} − ${m*q} = ${r}`]}}],
 [()=>{const [p,q]=shuffle([2,3,5,7]),a=ri(1,4),b=ri(1,3);return{q:`How many positive divisors does ${p}^${a} · ${q}^${b} have?`,ans:`${(a+1)*(b+1)}`,hints:["A divisor picks a power of each prime.","Count = (a + 1)(b + 1)"],steps:[`Powers of ${p}: 0…${a} → ${a+1} choices`,`Powers of ${q}: 0…${b} → ${b+1} choices`,`${a+1} × ${b+1} = ${(a+1)*(b+1)}`]}},
  ()=>{const b=pick([2,3,7,8]),e=ri(20,99),r=mp(b,e,10);return{q:`What is the units digit of ${b}^${e}?`,ans:`${r}`,hints:["Units digits of powers repeat in a cycle.","The cycle length is 4 — use the exponent mod 4."],steps:[`Powers of ${b} end in a cycle of length 4`,`${e} mod 4 = ${e%4}`,`Units digit = ${r}`]}}],
 [()=>{const p=pick([2,3,5]),q=pick([7,11,13]),a=ri(2,3);let s=0;for(let i=0;i<=a;i++)s+=p**i;const t=s*(1+q);return{q:`Find the sum of all positive divisors of ${p**a*q}.`,ans:`${t}`,hints:[`Factor it: ${p}^${a} × ${q}.`,"σ is multiplicative: σ(mn) = σ(m)σ(n) when gcd = 1"],steps:[`σ(${p}^${a}) = ${s}`,`σ(${q}) = ${1+q}`,`${s} × ${1+q} = ${t}`]}},
  ()=>{let b=ri(2,9);const m=pick([7,11,13]),n=ri(50,200);if(b%m===0)b++;const r=mp(b,n,m);return{q:`What is the remainder when ${b}^${n} is divided by ${m}?`,ans:`${r}`,hints:["Look for a repeating pattern in the remainders.",`Fermat: ${b}^${m-1} ≡ 1 (mod ${m})`],steps:[`${m} is prime, so powers repeat every ${m-1}`,`${n} mod ${m-1} = ${n%(m-1)}`,`Remainder = ${r}`]}}]],
Probability:[
 [()=>{const r=ri(2,9),b=ri(2,9),t=r+b;return{q:`A bag has ${r} red and ${b} blue marbles. One is drawn at random. What is P(red)?`,ans:fr(r,t),wrong:[fr(b,t),fr(r,b),fr(r+1,t+1)],hints:["Favorable outcomes over total outcomes.","P = favorable / total"],steps:[`Red = ${r}, total = ${t}`,`P = ${fr(r,t)}`]}},
  ()=>{const s=ri(2,12),w=6-Math.abs(s-7);return{q:`Two fair dice are rolled. What is the probability the sum is ${s}?`,ans:fr(w,36),wrong:[fr(w,12),fr(1,s),fr(w+1,36)],hints:["List the pairs that make the sum.","There are 36 equally likely outcomes."],steps:[`${w} pair(s) give a sum of ${s}`,`P = ${w}/36 = ${fr(w,36)}`]}}],
 [()=>{const r=ri(3,7),b=ri(2,6),n=r+b;return{q:`A bag has ${r} red and ${b} blue marbles. Two are drawn without replacement. What is P(both red)?`,ans:fr(r*(r-1),n*(n-1)),wrong:[fr(r*r,n*n),fr(r,n),fr(2*r,n*(n-1))],hints:["After the first draw, the bag changes.",`P = (${r}/${n}) × (? / ${n-1})`],steps:[`First red: ${r}/${n}`,`Second red: ${r-1}/${n-1}`,`P = ${fr(r*(r-1),n*(n-1))}`]}},
  ()=>{const n=ri(4,6),k=ri(1,n-1);return{q:`A fair coin is flipped ${n} times. What is the probability of exactly ${k} heads?`,ans:fr(C(n,k),2**n),wrong:[fr(1,2**n),fr(k,n),fr(C(n,k),2**n-1)],hints:["Count the arrangements of heads, then divide by all outcomes.",`C(${n},${k}) ÷ 2^${n}`],steps:[`Ways to choose heads: C(${n},${k}) = ${C(n,k)}`,`Total outcomes: 2^${n} = ${2**n}`,`P = ${fr(C(n,k),2**n)}`]}}],
 [()=>{const a=ri(4,7),g=ri(2,4),t=C(a+g,3),w=t-C(a,3);return{q:`A club has ${a} boys and ${g} girls. A committee of 3 is chosen at random. What is P(at least one girl)?`,ans:fr(w,t),wrong:[fr(C(a,3),t),fr(g,a+g),fr(w+1,t)],hints:["Use the complement: no girls at all.","P = 1 − C(boys,3) / C(total,3)"],steps:[`Total committees: C(${a+g},3) = ${t}`,`All-boy committees: C(${a},3) = ${C(a,3)}`,`P = 1 − ${fr(C(a,3),t)} = ${fr(w,t)}`]}},
  ()=>{const n=ri(3,6);return{q:`${n} fair six-sided dice are rolled. What is the probability that their product is even?`,ans:fr(2**n-1,2**n),wrong:[fr(1,2**n),fr(1,2),fr(2**n-2,2**n)],hints:["When is a product odd?","P(even) = 1 − P(all odd)"],steps:[`P(one die odd) = 1/2`,`P(all ${n} odd) = 1/${2**n}`,`P(even) = ${fr(2**n-1,2**n)}`]}}]],
"Combinatorics":[
 [()=>{const n=ri(4,7);return{q:`In how many ways can ${n} different books be arranged on a shelf?`,ans:`${fact(n)}`,hints:["Choose the first book, then the second, and so on.","n! = n × (n − 1) × … × 1"],steps:[`${n}! = ${fact(n)}`]}}],
 [()=>{const n=ri(6,12),k=ri(2,4);return{q:`In how many ways can a team of ${k} be chosen from ${n} students?`,ans:`${C(n,k)}`,hints:["Order does not matter.","C(n,k) = n! / (k!(n − k)!)"],steps:[`C(${n},${k}) = ${C(n,k)}`]}}],
 [()=>{const w=pick(["BANANA","LETTER","COOKIE","SUCCESS","MATH","ALGEBRA"]),cnt={};for(const c of w)cnt[c]=(cnt[c]||0)+1;let a=fact(w.length);Object.values(cnt).forEach(v=>a/=fact(v));return{q:`How many distinct arrangements of the letters of ${w} are there?`,ans:`${a}`,hints:["Repeated letters make some arrangements identical.","n! divided by the factorial of each repeat count"],steps:[`${w.length}! = ${fact(w.length)}`,`Divide by ${Object.values(cnt).filter(v=>v>1).map(v=>v+"!").join(" × ")||"1"}`,`Answer: ${a}`]}}]],
"Ratios & Percent":[

const OPTS=["A","B","C","D"];
function buildProblem(topic,level,seed){
  setSeed(seed);
  const p=pick(GEN[topic][level])();
  p.type=level===2?"num":"mc";p.topic=topic;p.level=level;
  let w=[...(p.wrong||[])];
  if(!p.wrong&&!isNaN(+p.ans)){const a=+p.ans;w=[a+1,a-1,a+ri(2,5),a-ri(2,6),a*2,a+10].map(String)}
  const numAns=!isNaN(+p.ans),pos=numAns&&+p.ans>=0;
  w=[...new Set(w)].filter(x=>x!==p.ans&&!(pos&&+x<0));
  for(let g=0;w.length<3&&g<60;g++){const x=numAns?String(+p.ans+ri(1,15)*(ri(0,1)?1:-1)):fr(ri(1,9),ri(10,20));if(x!==p.ans&&!w.includes(x)&&!(pos&&+x<0))w.push(x)}
  p.choices=shuffle([p.ans,...w.slice(0,3)]);
  return p;
}
const val=s=>{s=String(s).trim().replace(/\s/g,"");if(s.includes("/")){const[a,b]=s.split("/");return +a/+b}return Number(s)};
const isRight=(inp,ans)=>{const a=val(inp),b=val(ans);return inp.trim()===ans||(!isNaN(a)&&isFinite(a)&&Math.abs(a-b)<1e-9)};

/* ============ STORAGE ============ */
const KEY="mathsprint:v1";
const blank=()=>({topics:Object.fromEntries(TOPICS.map(t=>[t,{att:0,cor:0,time:0}])),streak:0,best:0,sessions:0});
const load=()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.topics)return{...blank(),...d,topics:{...blank().topics,...d.topics}}}catch(e){}return blank()};
const save=d=>{try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}};
const acc=t=>t.att?Math.round(100*t.cor/t.att):0;
const avgT=t=>t.att?t.time/t.att:0;
const fmt=s=>`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,"0")}`;
function weakest(st){
  const seen=TOPICS.filter(t=>st.topics[t].att>=3);
  if(!seen.length)return null;
  return seen.sort((a,b)=>acc(st.topics[a])-acc(st.topics[b])||avgT(st.topics[b])-avgT(st.topics[a]))[0];
}
const copyText=async t=>{try{await navigator.clipboard.writeText(t);return true}catch(e){try{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand("copy");a.remove();return ok}catch(e2){return false}}};

const TCOL={Algebra:["from-indigo-500 to-violet-500","x²"],Geometry:["from-emerald-500 to-teal-500","△"],"Number Theory":["from-amber-500 to-orange-500","≡"],Probability:["from-rose-500 to-pink-500","⚁"],Combinatorics:["from-sky-500 to-blue-600","C"],"Ratios & Percent":["from-lime-500 to-green-600","%"],"Coordinate Geometry":["from-fuchsia-500 to-purple-600","⊕"],"Logic & Puzzles":["from-slate-500 to-slate-700","?"]};

    <div className="flex items-center gap-3"><Logo s={44}/>
      <div><h1 className="text-2xl font-extrabold leading-none tracking-tight">Math<span className="grad">Sprint</span></h1><p className="mut text-sm">Train like a competitor</p></div>

function Arena({cfg,onFinish,onRecord,streak}){
  const sprint=cfg.mode!=="practice",N=cfg.n||5,LIM=cfg.limit||[300,420,600][cfg.level],comp=cfg.comp;
  const [i,setI]=useState(0),[sel,setSel]=useState(null),[txt,setTxt]=useState(""),[hints,setHints]=useState(0),[res,setRes]=useState(null),[left,setLeft]=useState(LIM);
  const results=useRef([]),t0=useRef(Date.now()),t00=useRef(Date.now());
  const p=useMemo(()=>comp?buildProblem(...compQ(comp,i)):buildProblem(cfg.topic,cfg.level,cfg.seed+i*7919),[i]);
  const finish=()=>onFinish(results.current,(Date.now()-t00.current)/1000);
  useEffect(()=>{if(!sprint)return;const id=setInterval(()=>setLeft(l=>l-1),1000);return()=>clearInterval(id)},[]);
  useEffect(()=>{if(sprint&&left<=0)finish()},[left]);
  const submit=a=>{
    if(res)return;
    const ok=isRight(a,p.ans),secs=(Date.now()-t0.current)/1000;
    const base=[10,20,30][p.level],pts=ok?base+Math.max(0,Math.round(base*(1-secs/120)/2)):0;results.current.push({ok,secs,hints,pts});onRecord(ok,secs,p.topic);setRes({ok});
  };
  const next=()=>{
    if(sprint&&i+1>=N)return finish();
    setI(i+1);setSel(null);setTxt("");setHints(0);setRes(null);t0.current=Date.now();
  };
  const done=results.current.filter(r=>r.ok).length;
  return <div className="space-y-4 pop">
    <div className="flex items-center gap-3">
      <button onClick={finish} className="mut p-1" aria-label="End session"><Icon n="x"/></button>
      <div className="flex-1 h-2.5 rounded-full bg-slate-300/40 overflow-hidden"><div className="h-full bg-gradient-to-r from-indigo-500 to-violet-500 transition-all" style={{width:`${sprint?(i+(res?1:0))/N*100:Math.min(100,(i+(res?1:0))*10)}%`}}/></div>
      <div className="flex items-center gap-1 text-orange-500 font-bold text-sm"><Icon n="flame" s={16}/>{streak}</div>
      {sprint&&<div className={`flex items-center gap-1 font-mono font-bold text-sm ${left<60?"text-rose-500":""}`}><Icon n="timer" s={16}/>{fmt(Math.max(0,left))}</div>}</div>
    <div className="flex justify-between text-xs mut font-semibold"><span>{comp?comp.title:`${cfg.topic} · ${LEVELS[cfg.level]}`}</span><span>{sprint?`Question ${i+1} of ${N}`:`Solved ${done}`}</span></div>
    <div className="card p-5"><p className="text-lg font-semibold leading-relaxed">{p.q}</p></div>
    {p.type==="mc"?<div className="space-y-2">{p.choices.map((c,k)=>{
      const right=res&&c===p.ans,wrong=res&&sel===c&&!res.ok;
      return <button key={c} disabled={!!res} onClick={()=>{setSel(c);submit(c)}} className={`w-full card p-3 flex items-center gap-3 text-left font-semibold ${right?"!border-emerald-500 bg-emerald-500/10":""} ${wrong?"!border-rose-500 bg-rose-500/10":""}`}>
        <span className="w-8 h-8 rounded-lg bg-indigo-500/10 text-indigo-500 grid place-items-center text-sm">{OPTS[k]}</span><span className="flex-1">{c}</span>
        {right&&<Icon n="check" c="text-emerald-500"/>}{wrong&&<Icon n="x" c="text-rose-500"/>}</button>})}</div>
    :<div className="flex gap-2"><input value={txt} disabled={!!res} onChange={e=>setTxt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&txt.trim()&&submit(txt)} inputMode="text" placeholder="Your answer" className="flex-1 min-w-0 card px-4 py-3 text-lg font-semibold outline-none bg-transparent"/>
      <Btn onClick={()=>submit(txt)} disabled={!txt.trim()||!!res} cls={Primary}>Check</Btn></div>}
    {!res&&!comp&&<div className="space-y-2">
      {hints>0&&<div className="card p-3 text-sm border-amber-400 bg-amber-400/10 space-y-1">{p.hints.slice(0,hints).map((h,k)=><div key={k}><b>Hint {k+1}:</b> {h}</div>)}</div>}
      {hints<2&&<button onClick={()=>setHints(hints+1)} className="flex items-center gap-2 text-amber-600 font-semibold text-sm"><Icon n="bulb" s={18}/>{hints===0?"Need a nudge?":"Show key formula"}</button>}</div>}
    {res&&<div className="space-y-3 pop">
      <div className={`card p-4 ${res.ok?"border-emerald-500":"border-rose-500"}`}>
        <div className={`font-bold mb-2 flex items-center gap-2 ${res.ok?"text-emerald-500":"text-rose-500"}`}><Icon n={res.ok?"check":"x"}/>{res.ok?"Correct!":`Not quite — the answer is ${p.ans}`}</div>
        <div className="text-xs font-bold mut uppercase tracking-wide mb-1">Step-by-step</div>
        <ol className="space-y-1 text-sm list-decimal pl-5">{p.steps.map((s,k)=><li key={k}>{s}</li>)}</ol></div>
      <Btn onClick={next} cls={`w-full flex items-center justify-center gap-2 ${Primary}`}>{sprint&&i+1>=N?"See results":"Next problem"}<Icon n="arrow" s={18}/></Btn></div>}
  </div>;
}

  return <div className="space-y-5 pop">

const MODES=[["spaced","Spaced revision","Expanding review gaps","timer"],["cram","Cramming","Intensive final 3 days","zap"],["test","Testing","Quizzes + mock tests","target"]];
function makePlan(t){
  const today=sod(new Date()),D=Math.round((sod(new Date(t.date+"T00:00:00"))-today)/864e5);
  if(D<1)return[];
  const tp=t.topics.split(",").map(x=>x.trim()).filter(Boolean),topics=tp.length?tp:[t.subject];
  const days=Array.from({length:D},()=>[]),add=(d,topic,label)=>{if(d>=0&&d<D)days[d].push({topic,label})};
  if(t.mode==="spaced"){
    const off=t.conf<=2?[0,1,2,4,7,12,18,25]:[0,1,3,7,14,21,30];
    topics.forEach((x,k)=>{const s=Math.floor(k*Math.max(1,Math.min(D-1,D/2))/topics.length);off.forEach((o,j)=>add(s+o,x,j?`Spaced review ${j}: recall without notes`:"First study session"))});
    if(D>1)add(D-1,"All topics","Final light review and flashcards");
  }else if(t.mode==="cram"){
    const w=Math.min(D,3),labs=["Intensive learning","Past-paper practice","Final recap and weak spots"];
    for(let j=0;j<w;j++)topics.forEach(x=>add(D-w+j,x,labs[3-w+j]));
    add(D-w-1,"Prepare","Gather notes, past papers and a formula sheet");
  }else{
    add(0,"All topics","Diagnostic quiz to find your gaps");
    for(let d=1;d<D-2;d++)add(d,topics[(d-1)%topics.length],d%2?"Closed-book practice quiz":"Quiz, then fix every mistake");
    if(D>=3){add(D-2,"All topics","Full timed mock test");add(D-1,"Mistake log","Redo every question you got wrong")}
    else if(D===2)add(1,"All topics","Full timed mock test");
  }
  return days.map((tasks,di)=>({di,date:addD(today,di),tasks:tasks.map(x=>({...x,mins:Math.max(10,Math.round(t.mins/tasks.length/5)*5)}))})).filter(d=>d.tasks.length);
}

    const st={phase:G.phase,qi:G.qi,n:G.cfg.n,topic:G.cfg.topic,level:G.cfg.level,secs:G.cfg.secs,seedBase:G.seedBase,left:G.left,ans:G.phase==="reveal"?G.ans:null,players:pl};

      const ok=d.choice===G.ans,pts=ok?500+Math.round(500*G.left/G.cfg.secs):0;G.answered[m.peer]=1;G.ok[m.peer]=ok;G.gain[m.peer]=pts;G.scores[m.peer]=(G.scores[m.peer]||0)+pts});

    {s.phase==="reveal"&&prob&&<><div className="card p-4 border-emerald-500"><div className="text-xs mut font-bold uppercase">Correct answer</div><div className="text-2xl font-extrabold text-emerald-500">{s.ans}</div>

function LivePlayer({exit}){
  const [code,setCode]=useState(""),[nick,setNick]=useState(()=>jl("livenick","")),[err,setErr]=useState(""),[s,setS]=useState(null),[picked,setPicked]=useState(null),[ready,setReady]=useState(false);
  const R=useRef(null);
  const join=async()=>{try{
    const room=await getRoom(code.trim().toUpperCase());R.current=room;
    room.on("state",m=>{if(m.data&&m.data.phase)setS(m.data)});
    await room.presence({role:"p",name:nick.trim().slice(0,16)});js("livenick",nick);setReady(true);
  }catch(e){setErr(`Could not join that game. Check the code. (${(e&&(e.code||e.message))||"error"})`)}};
  useEffect(()=>()=>{R.current&&R.current.leave().catch(()=>{})},[]);
  const myId=ready?(R.current.peers().find(x=>x.isMe)||{}).peer:null;
  const pick=c=>{if(picked&&picked.qi===s.qi)return;setPicked({qi:s.qi,choice:c});R.current.emit("ans",{qi:s.qi,choice:c}).catch(()=>{})};
  const prob=s&&(s.phase==="q"||s.phase==="reveal")?buildProblem(s.topic,s.level,s.seedBase+s.qi*7919):null;
  const mine=picked&&s&&picked.qi===s.qi?picked.choice:null;
  const idx=s?s.players.findIndex(x=>x.id===myId):-1,me=idx>=0?s.players[idx]:null;
  const Top=<div className="flex items-center"><button onClick={exit} className="mut p-1"><Icon n="x"/></button></div>;
  if(!ready)return <div className="space-y-4 pop">{Top}<h1 className="text-2xl font-extrabold">Join a game</h1>
    <input value={code} onChange={e=>setCode(e.target.value.toUpperCase())} maxLength={5} placeholder="CODE" className="w-full text-center text-3xl font-mono tracking-widest rounded-2xl px-3 py-4 bg-transparent border bd outline-none"/>
    <input value={nick} onChange={e=>setNick(e.target.value)} maxLength={16} placeholder="Nickname" className="w-full text-center text-lg rounded-2xl px-3 py-3 bg-transparent border bd outline-none"/>
    {err&&<p className="text-rose-500 text-sm">{err}</p>}
    <Btn disabled={code.trim().length<5||!nick.trim()} onClick={join} cls={`w-full ${Primary}`}>Join</Btn></div>;
  return <div className="space-y-4 pop">{Top}
    {(!s||s.phase==="lobby")&&<div className="text-center py-10"><div className="text-5xl mb-2">🎮</div><h2 className="text-xl font-extrabold">You are in, {nick}!</h2><p className="mut text-sm mt-1">Waiting for the host to start…{s&&` ${s.players.length} player${s.players.length===1?"":"s"} here.`}</p></div>}
    {s&&s.phase==="q"&&prob&&<><div className="flex justify-between text-sm font-bold"><span>Question {s.qi+1} of {s.n}</span><span className={s.left<=5?"text-rose-500":""}>{s.left}s</span></div>
      <div className="card p-5"><p className="text-lg font-semibold">{prob.q}</p></div>
      <Choices p={prob} pick={pick} sel={mine} disabled={!!mine}/>{mine&&<p className="text-center text-sm font-semibold text-indigo-500">Answer locked in. Waiting for the others…</p>}</>}
    {s&&s.phase==="reveal"&&<div className="text-center space-y-3"><div className={`rounded-3xl p-6 text-white ${me&&me.ok?"bg-emerald-500":"bg-rose-500"}`}>
      <div className="text-4xl">{me&&me.ok?"✓":"✗"}</div><div className="text-xl font-extrabold">{me&&me.ok?"Correct!":me&&me.answered?"Not quite":"No answer"}</div>{me&&me.gain>0&&<div className="font-bold">+{me.gain} points</div>}</div>
      <div className="card p-3 text-sm">Answer: <b>{s.ans}</b></div>
      {me&&<div className="font-bold">Rank {idx+1} of {s.players.length} · {me.score} pts</div>}</div>}
    {s&&s.phase==="final"&&<div className="space-y-3"><div className="text-center"><div className="text-5xl">{idx===0?"🏆":"🎉"}</div><h2 className="text-2xl font-extrabold">{me?`You finished #${idx+1}`:"Game over"}</h2>{me&&<p className="mut">{me.score} points</p>}</div><Board players={s.players} myId={myId} top={10}/><Btn onClick={exit} className="" cls="card w-full">Leave</Btn></div>}
  </div>;
}

      rows.slice(0,30).map((r,k)=><div key={r.id}>
        <div className={`flex items-center gap-3 px-4 py-3 border-b bd ${uid&&r.id===uid?"bg-indigo-500/10":""}`}>
          <div className="w-6 font-extrabold">{k<3?["🥇","🥈","🥉"][k]:k+1}</div><div className="flex-1 min-w-0"><div className="font-semibold truncate">{r.name}{uid&&r.id===uid&&" (you)"}</div>{cur.id==="f"&&k<5&&<div className="text-[11px] text-amber-600 font-semibold">{prizeOf(k)}</div>}</div>
          <div className="text-right"><div className="font-extrabold">{r.pts} pts</div><div className="mut text-xs">{r.correct} correct · {fmt(r.time)}</div></div></div>
        {cur.cut>1&&k===cur.cut-1&&rows.length>cur.cut&&<div className="text-center text-[11px] font-bold text-emerald-500 py-1 bg-emerald-500/10">Qualification line: top {cur.cut} advance</div>}</div>)}</div>
    <div className="card p-4 text-sm space-y-1"><div className="font-bold">How it works</div>
      <p className="mut">One chance at every stage. Everyone gets the same questions, points rise with difficulty and speed, and ties are broken by total time. Your ranking decides whether you advance, and from Round 3 onward every question is Olympiad level.</p></div>
  </div>;
}

/* ============ ABOUT US ============ */
function About({goChamp}){
  return <div className="space-y-5 pop">
    <div className="text-center pt-2"><div className="flex justify-center"><Logo s={72}/></div>
      <h1 className="text-3xl font-extrabold mt-3">About MathSprint</h1>
      <p className="mut mt-1">Making mathematics something students look forward to.</p></div>
    <div className="card p-5 space-y-3">
      <div className="flex items-center gap-3"><div className="w-16 h-16 rounded-full bg-gradient-to-br from-indigo-500 to-fuchsia-500 text-white grid place-items-center text-xl font-extrabold">AM</div>
        <div><div className="font-extrabold text-lg">Arnav Madhwani</div><div className="text-sm text-indigo-500 font-semibold">Founder &amp; CEO</div></div></div>
      <p className="text-sm leading-relaxed">Arnav is an avid mathematician himself, someone who genuinely enjoys a hard problem for its own sake. He founded MathSprint because he wants more students to feel that same pull: to see mathematics as a challenge worth chasing rather than a subject to get through.</p>
      <p className="text-sm leading-relaxed">His goal is simple: encourage students to engage with mathematics. That means making practice feel like play, making competition feel welcoming, and making the next difficult question feel like an invitation.</p></div>
    <div className="card p-5 space-y-2"><div className="font-bold">Our mission</div>
      <p className="text-sm leading-relaxed mut">To inspire a generation of confident problem-solvers by turning practice into a daily habit and competition into a celebration of curiosity, for every student, in every school.</p></div>
    <div className="grid grid-cols-1 gap-3">{[["Practice that adapts","Smart practice finds your weakest topic and trains it, from warm-ups to Olympiad-level problems."],["Competition that includes","Weekly Sunday Sprints, live quizzes you can host with a join code, and a once-a-year Championship open to every student."],["Learning that sticks","Step-by-step solutions, progressive hints and a revision planner built around your real tests."]].map(([t,d])=>
      <div key={t} className="card p-4"><div className="font-bold text-sm">{t}</div><div className="mut text-sm mt-1">{d}</div></div>)}</div>
    <button onClick={goChamp} className="w-full rounded-3xl p-4 text-left text-white bg-gradient-to-br from-amber-500 to-rose-600 shadow-lg flex items-center gap-3"><Icon n="crown" s={26}/><div><div className="font-extrabold">Join the Championship</div><div className="text-xs opacity-90">Your journey to the crown starts with one entry round</div></div><Icon n="arrow" c="ml-auto"/></button>
  </div>;

/* ============ MORE HUB ============ */
function More({sub,setSub,st,reset,practice,tests,setTests,done,setDone,goChamp}){
  const items=[["stats","Progress","Accuracy, streaks and weakest topic","chart"],["plan","Revision planner","Turn your test dates into a timetable","cal"],["about","About MathSprint","Our story and founder","users"]];
  if(!sub)return <div className="space-y-3 pop"><h1 className="text-2xl font-extrabold">More</h1>
    {items.map(([k,t,d,ic])=><button key={k} onClick={()=>setSub(k)} className="w-full card p-4 flex items-center gap-3 text-left"><div className="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-500 grid place-items-center"><Icon n={ic}/></div><div className="flex-1"><div className="font-bold">{t}</div><div className="mut text-sm">{d}</div></div><Icon n="arrow" c="mut" s={18}/></button>)}</div>;
  return <div className="space-y-4"><button onClick={()=>setSub(null)} className="mut text-sm font-semibold flex items-center gap-1"><span className="rotate-180 inline-block"><Icon n="arrow" s={16}/></span>Back</button>
    {sub==="stats"&&<Dash st={st} reset={reset} practice={practice}/>}
    {sub==="plan"&&<Plan tests={tests} setTests={setTests} done={done} setDone={setDone} practice={practice}/>}
    
    {sub==="about"&&<About goChamp={goChamp}/>}</div>;
}

/* ============ APP ============ */
function App(){
  const [st,setSt]=useState(load);
  const [tab,setTab]=useState("train"),[screen,setScreen]=useState("home");
  const [cfg,setCfg]=useState({topic:"Algebra",level:0,mode:"practice",seed:1});
  const [play,setPlay]=useState(cfg),[out,setOut]=useState(null),[run,setRun]=useState(0);
  const [tests,setTests]=useState(()=>jl("tests",[])),[done,setDone]=useState(()=>jl("done",{})),[mine,setMine]=useState(()=>jl("mine",{}));
  const [id,setId]=useState(null),busy=useRef(false),[nick,setNick]=useState(()=>jl("nick",""));
  const [db,setDb]=useState(null),[board,setBoard]=useState([]);
  const info=useMemo(compInfo,[]),champ=useMemo(champInfo,[]),[sub,setSub]=useState(null),[dir,setDir]=useState(1);
  useEffect(()=>save(st),[st]);
  useEffect(()=>js("tests",tests),[tests]);useEffect(()=>js("done",done),[done]);useEffect(()=>js("mine",mine),[mine]);
  useEffect(()=>js("id",id&&!id.verified?id:null),[id]);useEffect(()=>js("nick",nick),[nick]);
  useEffect(()=>{let off=()=>{};(async()=>{try{
    if(!window.claude)return;
    const [u,d]=await Promise.all([window.claude.use("user"),window.claude.use("db")]);
    if(u){const m=await u.me();if(m&&m.id)setId({uid:m.id,email:m.email,name:m.name,verified:true})}
    if(d){setDb(d);off=d.collection("board").onSnapshot(s=>setBoard(s.docs.map(x=>({id:x.id,...x.data()}))),()=>{})}
  }catch(e){}})();return()=>off()},[]);
  const dn=nick||(id&&(id.name||(id.email||"").split("@")[0]))||"Player";
  const myMine={...mine,...((board.find(r=>id&&r.id===id.uid)||{}).scores||{})};
  const go=c=>{setPlay(c);setRun(r=>r+1);setTab("train");setScreen("play")};
  const start=()=>{const n={...cfg,seed:Math.floor(Math.random()*900000)+100000};setCfg(n);go(n)};
  const join=code=>{const m=code.trim().match(/^([0-7])([0-2])-(\d{3,9})$/);if(!m)return alert("Invalid code. It looks like 11-482913");go({topic:TOPICS[+m[1]],level:+m[2],mode:"sprint",seed:+m[3]})};
  const startComp=async(kind,pid,seed,mock,ext)=>{
    const c=ext||COMP[kind];
    if(!mock){
      if(busy.current||!(db&&id&&id.uid))return;busy.current=true;
      try{const ref=db.doc("board/"+id.uid),s=await ref.get(),p=s.exists?(s.data().scores||{}):{};
        if(p[pid]||myMine[pid]){alert("You have already used your attempt for this round.");busy.current=false;return}
        await ref.set({name:dn,scores:{...p,[pid]:{pts:0,correct:0,time:0,started:true,ts:Date.now()}}});
        setMine(m=>({...m,[pid]:{pts:0,correct:0,time:0,started:true}}));
      }catch(e){alert("Could not register your attempt. Check your connection and try again.");busy.current=false;return}
      busy.current=false;
    }
    go({topic:"Algebra",level:0,mode:"comp",seed:1,n:c.n,limit:c.limit,comp:{kind,id:pid,seedBase:seed,title:c.title+(mock?" (warm-up)":""),mock,levels:c.levels}})};
  const record=(ok,secs,topic)=>setSt(s=>{const t=s.topics[topic],streak=ok?s.streak+1:0;
    return{...s,streak,best:Math.max(s.best,streak),topics:{...s.topics,[topic]:{att:t.att+1,cor:t.cor+(ok?1:0),time:t.time+secs}}}});
  const finish=(results,time)=>{
    setOut({results,time});setSt(s=>({...s,sessions:s.sessions+1}));setScreen("done");
    const c=play.comp;
    if(c&&!c.mock&&results.length){
      const e={pts:results.reduce((a,x)=>a+x.pts,0),correct:results.filter(x=>x.ok).length,time:Math.round(time),ts:Date.now()};
      setMine(m=>({...m,[c.id]:e}));
      if(db&&id&&id.uid){const ref=db.doc("board/"+id.uid);
        ref.get().then(s=>ref.set({name:dn,scores:{...(s.exists?(s.data().scores||{}):{}),[c.id]:e}})).catch(()=>{})}
    }
  };
  const playing=screen==="play";
  const TABS=[["train","Train","home"],["live","Live","users"],["compete","Compete","trophy"],["champ","Championship","crown"],["more","More","menu"]];
  const ORDER=TABS.map(t=>t[0]),goTab=k=>{setDir(ORDER.indexOf(k)>=ORDER.indexOf(tab)?1:-1);if(k===tab&&k==="more")setSub(null);setTab(k);if(k==="train"&&screen==="play")setScreen("home")};
  return <div className="max-w-md mx-auto px-4 pt-5 pb-28 min-h-screen">
    <div key={`${tab}|${screen}|${run}`} className={dir>=0?"slide-r":"slide-l"}>
    {!playing&&!(tab==="train"&&screen==="home")&&<div className="mb-4"><Brand onClick={()=>{setTab("more");setSub("about")}}/></div>}
    {tab==="train"&&screen==="home"&&<Home cfg={cfg} setCfg={setCfg} start={start} join={join} st={st} goLive={()=>setTab("live")}/>}
    {tab==="train"&&playing&&<Arena key={run} cfg={play} onFinish={finish} onRecord={record} streak={st.streak}/>}
    {tab==="train"&&screen==="done"&&<Done cfg={play} out={out} again={start} home={()=>setScreen("home")} board={()=>{setTab(play.comp&&play.comp.kind==="champ"?"champ":"compete");setScreen("home")}}/>}
    </div>
    <div className={tab==="live"?(dir>=0?"slide-r":"slide-l"):""} style={{display:tab==="live"?"block":"none"}}><Live/></div>
    <div key={`${tab}|${sub}`} className={dir>=0?"slide-r":"slide-l"}>
    {tab==="compete"&&<Compete id={id} setId={setId} db={db} info={info} mine={myMine} board={board} startComp={startComp} nick={nick} setNick={setNick} goChamp={()=>setTab("champ")}/>}
    {tab==="champ"&&<Championship id={id} db={db} board={board} startComp={startComp} info={champ} name={dn}/>}
    {tab==="more"&&<More sub={sub} setSub={setSub} st={st} reset={()=>setSt(blank())} practice={t=>{setCfg({...cfg,topic:t});setTab("train");setScreen("home")}} tests={tests} setTests={setTests} done={done} setDone={setDone} goChamp={()=>setTab("champ")}/>}
    </div>
    {!playing&&<nav className="fixed bottom-0 inset-x-0 border-t bd" style={{background:"color-mix(in srgb,var(--card) 86%,transparent)",backdropFilter:"blur(16px)",WebkitBackdropFilter:"blur(16px)",paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
      <div className="relative max-w-md mx-auto grid grid-cols-5">
        <div className="absolute inset-y-1.5 left-0 w-1/5 px-1.5 pointer-events-none" style={{transform:`translateX(${ORDER.indexOf(tab)*100}%)`,transition:"transform .5s cubic-bezier(.34,1.56,.64,1)"}}><div className="h-full rounded-2xl bg-indigo-500/10"/></div>
        {TABS.map(([k,l,ic])=><button key={k} onClick={()=>goTab(k)} className={`py-3 flex flex-col items-center gap-0.5 text-[11px] font-semibold ${tab===k?"text-indigo-500":"mut"}`}><span className={tab===k?"tab-on":"inline-block"}><Icon n={ic}/></span>{l}</button>)}</div></nav>}
  </div>;
}
document.addEventListener("pointerdown",e=>{const b=e.target.closest&&e.target.closest("button");if(!b||b.disabled)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,sp=document.createElement("span");sp.className="ripple";sp.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(sp);setTimeout(()=>sp.remove(),650)});
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
